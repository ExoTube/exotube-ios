# Compila ExoTube para iPhone en una Mac de GitHub (no hace falta tener una):
#  1. genera el proyecto de Xcode desde project.yml;
#  2. pasa las pruebas en un iPhone simulado;
#  3. lo usa de verdad, con internet: busca, reproduce y descarga, y saca capturas;
#  4. arma ExoTube.ipa SIN firmar: cada persona la firma con su propia cuenta de Apple al
#     instalarla con AltStore o Sideloadly.
name: Compilar

on:
  push:
  workflow_dispatch:

jobs:
  iphone:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APP: io.github.exotube.app
      # Un video corto de prueba (Soda Stereo, "De Música Ligera").
      VIDEO: OX-us7PEfkc
      # Los mismos enlaces de prueba que en Android (StreamSpeedBenchmark).
      ENLACE_X: https://x.com/starwars/status/665052190608723968
      ENLACE_TIKTOK: https://www.tiktok.com/@scout2015/video/6718335390845095173
    steps:
      - uses: actions/checkout@v4

      - name: Elegir el Xcode más nuevo
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Python para iPhone y yt-dlp
        run: |
          # Python oficial para iOS, empaquetado por BeeWare (python.org lo recomienda).
          curl -sSL -o python-ios.tar.gz             "https://github.com/beeware/Python-Apple-support/releases/download/3.13-b15/Python-3.13-iOS-support.b15.tar.gz"
          tar -xzf python-ios.tar.gz Python.xcframework
          # yt-dlp y certifi son Python puro: sirven igual en el iPhone.
          python3 -m venv /tmp/pip-env
          /tmp/pip-env/bin/pip install --quiet --no-deps --target app_packages yt-dlp certifi
          python3 -c "import sys; sys.path.insert(0, 'app_packages'); import yt_dlp.version as v; print('yt-dlp', v.__version__)"

      - name: "Diagnóstico: ¿YouTube deja descargar desde esta Mac?"
        continue-on-error: true
        run: |
          # Si YouTube bloquea las Macs de GitHub (centros de datos), aquí se ve: así se sabe si un
          # fallo de descarga es de la app o solo de este entorno de pruebas.
          /tmp/pip-env/bin/pip install --quiet yt-dlp
          /tmp/pip-env/bin/yt-dlp --no-warnings -F "https://www.youtube.com/watch?v=$VIDEO" 2>&1 | tail -15
          /tmp/pip-env/bin/yt-dlp --no-warnings -F "$ENLACE_X" 2>&1 | tail -6
          /tmp/pip-env/bin/yt-dlp --no-warnings -F "$ENLACE_TIKTOK" 2>&1 | tail -6

      - name: Generar el proyecto
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Buscar un iPhone simulado
        run: |
          SIM=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in devices if "iOS" in k), reverse=True)
          print(next(d["udid"] for k in ios for d in devices[k] if d["name"].startswith("iPhone")))')
          echo "SIM=$SIM" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$SIM"

      - name: Pruebas
        run: |
          xcodebuild test -project ExoTube.xcodeproj -scheme ExoTube \
            -destination "id=$SIM" -derivedDataPath build -quiet

      - name: Usar la app y sacar capturas
        run: |
          xcrun simctl boot "$SIM" || true
          xcrun simctl bootstatus "$SIM" -b
          # Instalar tarda varios minutos la primera vez: no es que esté colgado.
          xcrun simctl install "$SIM" build/Build/Products/Debug-iphonesimulator/ExoTube.app
          mkdir -p capturas
          shot() {   # shot <nombre> <segundos de espera> <argumentos para la app...>
            name=$1; wait=$2; shift 2
            xcrun simctl terminate "$SIM" "$APP" 2>/dev/null || true
            xcrun simctl launch "$SIM" "$APP" "$@"
            sleep "$wait"
            xcrun simctl io "$SIM" screenshot "capturas/$name.png"
          }
          shot 1-explorar 15 -tab explorar
          shot 2-busqueda 15 -tab explorar -buscar "soda stereo"
          shot 3-reproductor 20 -tab explorar -reproducir "$VIDEO"
          shot 4-descargando 12 -tab biblioteca -descargar "$VIDEO"
          sleep 90
          xcrun simctl io "$SIM" screenshot capturas/5-descargado.png
          shot 6-biblioteca 8 -tab biblioteca
          shot 7-ajustes 15 -tab ajustes
          # TikTok, Instagram, X y Facebook pasan por yt-dlp (Python dentro de la app).
          shot 8-enlace-x 30 -tab explorar -buscar "$ENLACE_X"
          shot 9-enlace-tiktok 30 -tab explorar -buscar "$ENLACE_TIKTOK"
          shot 10-descargando-enlace 30 -tab biblioteca -descargar-enlace "$ENLACE_X"
          sleep 60
          xcrun simctl io "$SIM" screenshot capturas/11-descargado-enlace.png
          # Lo descargado de verdad, para revisarlo.
          DATA=$(xcrun simctl get_app_container "$SIM" "$APP" data)
          ls -la "$DATA/Documents/ExoTube" | tee capturas/archivos.txt

      - name: Armar ExoTube.ipa (sin firmar)
        run: |
          xcodebuild build -project ExoTube.xcodeproj -scheme ExoTube -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build-ios -quiet \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p Payload
          cp -R build-ios/Build/Products/Release-iphoneos/ExoTube.app Payload/
          zip -qry ExoTube.ipa Payload
          ls -lh ExoTube.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ExoTube-ipa
          path: ExoTube.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas
          path: capturas/
